# Main configuration for all reported experiments.
# Every number in the report is produced from this file by `python run_all.py --stage all`.

seed: 0
data_dir: data
results_dir: results
checkpoint_dir: checkpoints

esc50_url: https://github.com/karolpiczak/ESC-50/archive/master.zip
checkpoint_url: https://huggingface.co/lukewys/laion_clap/resolve/main/{name}.pt
sample_rate: 48000          # LAION-CLAP expects 48 kHz mono
clip_seconds: 5             # every ESC-50 clip is 5 s

reproduction:
  # The four general-audio checkpoints released with the paper.
  checkpoints: [630k-best, 630k-audioset-best, 630k-fusion-best, 630k-audioset-fusion-best]
  templates:
    - "This is a sound of {}."   # prompt in the official README evaluation code
    - "This a sound of {}."      # prompt as printed in the paper (Sec. 4.3, typo kept on purpose)
    - "{}"                       # bare class name

main_checkpoint: 630k-audioset-best   # pip default non-fusion model
main_template: "This is a sound of {}."

noise:
  test_types: [white, pink, brown]
  test_snrs_db: [20, 10, 5, 0]
  aug_type: white             # only white noise is used to build the noisy cache
  aug_snr_range_db: [0, 20]   # SNR drawn uniformly per support clip

fewshot:
  shots: [1, 4, 16]
  seeds: [0, 1, 2]
  zs_logit_scale: 100
  tip_alpha: [0.25, 0.5, 1.0, 2.0, 4.0]
  tip_beta: [1.0, 3.0, 5.5, 7.0, 10.0]
  lp_C: [0.01, 0.1, 1.0, 10.0, 100.0]

embed:
  batch_size: 32
  latency_clips: 100
